name: internal_zeek_conn
description: "A preset for consuming Zeek Conn logs"
title: "Zeek Conn"
iconURL: "https://docs.zeek.org/en/master/_images/zeek-logo-text.png"
author: "Alex Ott <alexey.ott@databricks.com>"
autoloader:
  format: jsonl
  cloudFiles:
    schemaHints: "`id.orig_p` int, `id.resp_p` int, ts double, status_code int, orig_l2_addr string, resp_l2_addr string"
bronze:
  preTransform:
    -
      - "*"
      - cast(ts as timestamp) as time
silver:
  transform:
    - name: zeek_conn
      fields:
        - name: id_origin_host
          from: "`id.orig_h`"
        - name: id_origin_port
          from: "`id.orig_p`"
        - name: id_response_host
          from: "`id.resp_h`"
        - name: id_response_port
          from: "`id.resp_p`"
      utils:
        unreferencedColumns:
          preserve: true
          omitColumns:
            - "`id.resp_h`"
            - "`id.orig_h`"
            - ts
            - "`id.resp_p`"
            - "`id.orig_p`"
gold:
  - name: network_activity
    input: zeek_conn
    fields:
      - name: activity_id
        expr: |
          cast(
            CASE
              WHEN conn_state IN ('SF', 'RSTO', 'RSTR', 'RSTRH', 'SH', 'SHR') THEN 2
              WHEN conn_state = 'S0' THEN 4
              WHEN conn_state = 'REJ' THEN 5
              ELSE 6
            END
          as int)
      - name: activity_name  # Convert this into UDF?
        expr: |
          CASE
            WHEN activity_id = '0' THEN 'Unknown'
            WHEN activity_id = '1' THEN 'Open'
            WHEN activity_id = '2' THEN 'Close'
            WHEN activity_id = '3' THEN 'Reset'
            WHEN activity_id = '4' THEN 'Fail'
            WHEN activity_id = '5' THEN 'Refuse'
            WHEN activity_id = '6' THEN 'Traffic'
            WHEN activity_id = '7' THEN 'Listen'
            ELSE 'Other'
          END
      - name: category_uid
        expr: CAST('4' AS INT)
      - name: category_name
        literal: Network Activity
      - name: class_uid
        expr: CAST('4001' AS INT)
      - name: class_name
        literal: Network Activity
      - name: severity_id
        expr: CAST('1' AS INT)  # Informational
      - name: severity
        literal: Informational
      - name: type_uid
        expr: CAST(class_uid * 100 + activity_id AS BIGINT)
      - name: type_name
        expr: "concat('Network Activity: ', activity_name)"
      - name: time
        from: time
      - name: start_time
        from: time
      - name: metadata.product.name
        literal: Zeek Conn
      - name: metadata.product.vendor_name
        literal: Zeek
      - name: metadata.uid
        from: uid
      - name: src_endpoint.ip
        from: id_origin_host
      - name: dst_endpoint.ip
        from: id_response_host
      - name: src_endpoint.port
        from: id_origin_port
      - name: dst_endpoint.port
        from: id_response_port
      - name: connection_info.uid
        from: uid
      - name: connection_info.protocol_name
        expr: lower(proto)
      - name: connection_info.flag_history
        from: history
      - name: connection_info.protocol_num
        expr: | # TODO: implement as UDF?
          CAST((
            CASE WHEN LOWER(proto) = 'icmp' THEN 1
            WHEN LOWER(proto) = 'tcp' THEN 6
            WHEN LOWER(proto) = 'udp' THEN 17
            ELSE 255 END)
          AS INT)
      - name: connection_info.direction_id
        expr: CAST('0' AS INT)  # Unknown
      # - name: app_name
      #   from: service
      - name: traffic.bytes_in
        from: resp_bytes
      - name: traffic.bytes_out
        from: orig_bytes
      - name: traffic.bytes
        expr: resp_bytes + orig_bytes
      # - name: traffic.bytes_missed
      #   from: missed_bytes
      - name: traffic.packets_in
        from: resp_pkts
      - name: traffic.packets_out
        from: orig_pkts
      - name: traffic.packets
        expr: orig_pkts + resp_pkts
      # - name: traffic.bytes_total
      #   expr: orig_ip_bytes + resp_ip_bytes
      # - name: duration
      #   expr: CAST(duration*1000 AS BIGINT)
      - name: src_endpoint.mac
        from: orig_l2_addr
      - name: dst_endpoint.mac
        from: resp_l2_addr
